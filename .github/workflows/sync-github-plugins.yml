name: Sync GitHub plugins

on:
  # GitHub Actions cron uses UTC. 02:00 UTC is 10:00 in Asia/Shanghai.
  schedule:
    - cron: "0 2 * * *"
    # Compensation run: retries the daily sync if the primary run was delayed or missed.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-plugin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the snapshot
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh the GitHub snapshot with bounded retries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            if npm run sync:github; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "GitHub plugin sync failed after ${max_attempts} attempts." >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 60))
            echo "Sync failed on attempt ${attempt}; retrying in ${sleep_seconds}s."
            sleep "$sleep_seconds"
          done

      - name: Commit the changed snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/github-plugins.json; then
            echo "No plugin changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-plugins.json
          git commit -m "Refresh GitHub plugin snapshot"
          git push
